name: Sample Java 1 CI & Docker Push (Performance Metrics Layer)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  ci-cd-pipeline:
    name: Test, Build, and Docker Push
    runs-on: ubuntu-latest
    steps:
    # 1. 초기 세팅 (한 번만 실행)
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 2. 테스트 및 빌드 진행 (같은 볼륨 공유)
    - name: Run Unit Tests
      run: ./gradlew test

    - name: Build Artifact (Exclude Tests)
      run: ./gradlew build -x test

    # 3. 아티팩트 업로드 (기능 유지를 위해 깃허브 화면에 보관)
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sample-java1-build
        path: build/libs/*SNAPSHOT.jar
        retention-days: 1

    # 4. 도커 빌드 및 배포 (별도 다운로드 없이 같은 방에 있는 파일 즉시 사용)
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/git_action_java
